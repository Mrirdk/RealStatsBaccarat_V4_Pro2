name: Build Android 14 AutoRobot V4 Pro APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        run: |
          if [ -f "settings.gradle.kts" ]; then
            gradle assembleDebug
          elif [ -f "RealStatsBaccarat_V4_Pro/settings.gradle.kts" ]; then
            cd RealStatsBaccarat_V4_Pro && gradle assembleDebug
          else
            echo "Không tìm thấy tệp settings.gradle.kts trong repo!"
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RealStatsBaccarat-V4-Pro-APK
          path: "**/app/build/outputs/apk/debug/app-debug.apk"
